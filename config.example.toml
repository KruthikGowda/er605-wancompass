# NetPulse configuration.
# Installed copy lives at /etc/netpulse/config.toml (root:netpulse, mode 640).

[general]
# monitor  = measure and record only
# dry-run  = also log which WAN the decision engine *would* pick
# This global decision engine never changes routes. Opt-in group Smart WAN routing is a
# separate, owner-enabled control and requires every group member to pass route readiness.
mode = "dry-run"
interval_seconds = 10       # one probe cycle per WAN every 10 s
window_seconds = 300        # rolling window used for health (5 min)
db_path = "/var/lib/netpulse/netpulse.db"
preferred_wan = "WAN2"      # starting point for dry-run recommendations

[probe]
targets = ["1.1.1.1", "8.8.8.8", "9.9.9.9"]
count = 5                   # pings per target per cycle
packet_interval = 0.2       # seconds between pings (0.2 is the non-root minimum)
timeout_seconds = 1         # per-reply timeout

# Each WAN is probed from its own source IP on the Pi.
# ER605 policy routes pin that source IP to one WAN, so the probe
# is guaranteed to leave through that WAN.
# Leave source_ip empty to probe via the normal route (no per-WAN proof).
[[wan]]
name = "WAN1"
label = "Example ISP A"            # example display label; set your subscribed plan below
source_ip = "192.168.0.201"
plan_mbps = 200
expected_asns = []  # discover and verify your own provider origin ASN(s)

[[wan]]
name = "WAN2"
label = "Example ISP B"         # example display label; set your subscribed plan below
source_ip = "192.168.0.202"
plan_mbps = 300
expected_asns = []  # discover and verify your own provider origin ASN(s)

[thresholds]
# Absolute limits (always apply)
degraded_loss_pct = 5
bad_loss_pct = 15
degraded_rtt_ms = 120
bad_rtt_ms = 250
degraded_jitter_ms = 30
# Relative to the learned baseline for each WAN/target
degraded_rtt_factor = 2.5
bad_rtt_factor = 4.0
min_rtt_increase_ms = 20    # ignore ratio jumps smaller than this (7 ms -> 20 ms is fine)
# A WAN is OFFLINE when every target fails for this many consecutive cycles
offline_cycles = 3

[decision]
min_score_advantage = 15
hold_seconds = 180          # advantage must persist this long before switching
cooldown_seconds = 600      # no non-emergency switch within 10 min of the last one
recovery_seconds = 600      # a WAN that was BAD/OFFLINE must be stable this long before we return

[web]
host = "0.0.0.0"
port = 8080
auth_file = "/etc/netpulse/web.auth"  # generated by install.sh; required for LAN access

[speedtest]
# On-demand tests (Telegram ⚡ or the dashboard) always work. Scheduled tests are off until the
# Pi has a proper power supply: a speed test is the heaviest thing it does.
# Each run tests both ISPs: about 35 MB per ISP, ~280 MB/day with 4 times a day.
schedule_enabled = false
times = ["06:00", "13:00", "20:30", "23:30"]   # includes the evening peak, when dips show up
download_mb = 25
upload_mb = 10
streams = 4
dip_pct = 50                                    # alert when below 50% of that ISP's usual speed
monthly_budget_mb = 0                           # measured payload cap for manual + scheduled tests; 0 disables it

[router]
# Read-only view of the ER605. Easiest setup: sudo python3 tools/router_setup.py
# The password lives in credentials_file (root:netpulse, mode 640), never here.
enabled = false
host = "192.168.0.1"
poll_minutes = 10           # each check logs in briefly, which logs you out of the Omada web page
credentials_file = "/etc/netpulse/router.toml"
controls_enabled = false     # unlock manual per-device route changes only when the pilot is ready
internet_controls_enabled = false # stays off until separately routed IPv4 pause validation is complete
protected_macs = []          # optional additional devices that must never be paused
kill_switch = "/etc/netpulse/controls.disabled"  # create this file to block all router writes
presence_probes_enabled = false  # optional LAN pings; no reply is not proof a device is offline
presence_probe_interval_seconds = 60
presence_confirm_misses = 3
syslog_enabled = false      # optional ER605 DHCP allocation hints; router forwarding is separate/owner-enabled
syslog_port = 514           # ER605 syslog convention; receiver accepts packets only from router.host

[system_health]
enabled = true
interval_seconds = 300
low_disk_pct = 10           # alert when less than 10% of the NetPulse data volume is free
low_memory_pct = 10         # alert when less than 10% of Pi memory is available
memory_recovery_pct = 15    # clear the memory alert after availability rises to 15%

[backup]
enabled = false              # enable after configuring a mounted destination below
directory = "/var/lib/netpulse/backups"
mount_path = ""              # for a NAS mount, set its mount point; backup fails if it is unavailable
interval_days = 7
keep = 8

[telegram]
# Easiest setup: sudo python3 -m tools.telegram_setup  (fills these in for you)
enabled = false
bot_token = ""
chat_id = ""
quiet_start = "23:00"       # slow/bad alerts wait until quiet_end; "down" and "back up" always come through
quiet_end = "07:00"
digest_time = ""            # daily summary of the last 24 h (opt in with e.g. "09:00")
weekly_report_time = ""      # Sunday summary of the last 7 days; e.g. "09:00" to enable
device_activity_notifications = false # device join/leave/ping alerts; inventory/history remain available on demand
