name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional validation dependencies
        run: python -m pip install '.[ha-validation]'
      - name: Run offline tests
        env:
          NETPULSE_LIVE: '0'
        run: python -B -m unittest discover -s tests -t .
      - name: Validate Home Assistant example
        run: python tools/validate_home_assistant.py
      - name: Audit tracked publication files
        run: python tools/publication_audit.py
